<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="glowMon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="monitorScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="40%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="170" fill="url(#glowMon)"/>

  <!-- Monitor Panel Frame (Curved Effect) -->
  <rect x="50" y="80" width="300" height="180" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
  
  <!-- Screen Display -->
  <rect x="56" y="86" width="288" height="168" rx="4" fill="url(#monitorScreen)"/>

  <!-- Panel Graphics / Grid Test -->
  <path d="M 56 160 Q 200 130 344 160" stroke="#00f5a0" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  <text x="200" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20">LG UltraGear 27&quot; 165Hz</text>
  <text x="200" y="165" text-anchor="middle" fill="#5eead4" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">QHD IPS •; 1ms •; G-Sync Verified</text>

  <!-- Bottom Bezel Logo Mark -->
  <circle cx="200" cy="250" r="3" fill="#00f5a0"/>

  <!-- Monitor Stand Neck -->
  <path d="M 188 260 L 182 320 L 218 320 L 212 260 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- V-Shaped Gaming Stand Base -->
  <path d="M 120 340 L 200 320 L 280 340 L 270 345 L 200 326 L 130 345 Z" fill="#0f172a" stroke="#00f5a0" stroke-width="1.2"/>
</svg>
