<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="glowLap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="laptopBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Glow Background -->
  <circle cx="200" cy="200" r="170" fill="url(#glowLap)"/>

  <!-- Laptop Display Shell (Open) -->
  <rect x="75" y="80" width="250" height="160" rx="12" fill="url(#laptopLid)" stroke="#64748b" stroke-width="1.5"/>
  <rect x="83" y="88" width="234" height="144" rx="8" fill="#020617"/>
  <rect x="87" y="92" width="226" height="136" rx="6" fill="url(#laptopScreen)"/>

  <!-- Top Bezel Camera -->
  <circle cx="200" cy="85" r="2.5" fill="#000000" stroke="#334155" stroke-width="1"/>

  <!-- Code/UI on Screen -->
  <rect x="100" y="105" width="200" height="95" rx="6" fill="#020617" fill-opacity="0.8" stroke="#00f5a0" stroke-opacity="0.3"/>
  <circle cx="112" cy="116" r="3" fill="#ef4444"/>
  <circle cx="120" cy="116" r="3" fill="#f59e0b"/>
  <circle cx="128" cy="116" r="3" fill="#10b981"/>
  
  <text x="110" y="136" fill="#00f5a0" font-family="monospace" font-size="9" font-weight="bold">ReGrade AI •; Hardware Diagnostics</text>
  <text x="110" y="152" fill="#cbd5e1" font-family="monospace" font-size="8">Apple M1 •; 8-Core CPU •; 256GB</text>
  <text x="110" y="166" fill="#94a3b8" font-family="monospace" font-size="8">Battery Health: 87% (Grade B)</text>
  <text x="110" y="180" fill="#38bdf8" font-family="monospace" font-size="8">Keyboard Integrity: 100% Passed</text>

  <!-- Laptop Hinge -->
  <rect x="140" y="238" width="120" height="6" rx="3" fill="#0f172a"/>

  <!-- Laptop Base (Perspective) -->
  <path d="M 40 280 L 70 240 L 330 240 L 360 280 L 40 280 Z" fill="url(#laptopBase)" stroke="#64748b" stroke-width="1.2"/>
  
  <!-- Keyboard Inset Area -->
  <path d="M 75 264 L 90 244 L 310 244 L 325 264 Z" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Trackpad -->
  <rect x="170" y="267" width="60" height="11" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>

  <!-- Front Lip Notch -->
  <rect x="180" y="278" width="40" height="3" rx="1.5" fill="#94a3b8"/>
</svg>
