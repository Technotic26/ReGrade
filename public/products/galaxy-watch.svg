<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="glowWatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dialRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#glowWatch)"/>

  <!-- Top Strap -->
  <path d="M 162 40 L 238 40 L 230 130 L 170 130 Z" fill="url(#strap)" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="50" x2="200" y2="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Bottom Strap -->
  <path d="M 170 270 L 230 270 L 238 360 L 162 360 Z" fill="url(#strap)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="200" cy="305" r="4" fill="#020617"/>
  <circle cx="200" cy="325" r="4" fill="#020617"/>
  <circle cx="200" cy="345" r="4" fill="#020617"/>

  <!-- Watch Circular Case Outer Ring -->
  <circle cx="200" cy="200" r="82" fill="url(#dialRing)" stroke="#94a3b8" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.5))"/>

  <!-- Watch Inner Bezel -->
  <circle cx="200" cy="200" r="74" fill="#020617" stroke="#1e293b" stroke-width="2"/>

  <!-- AMOLED Screen Wallpaper / UI -->
  <circle cx="200" cy="200" r="70" fill="#042f2e"/>
  
  <!-- Activity Ring Graphics -->
  <circle cx="200" cy="200" r="54" stroke="#1e293b" stroke-width="6" fill="none"/>
  <path d="M 200 146 A 54 54 0 1 1 150 220" stroke="#00f5a0" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 200 156 A 44 44 0 1 1 180 240" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Digital Time Display -->
  <text x="200" y="196" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">10:08</text>
  <text x="200" y="214" text-anchor="middle" fill="#00f5a0" font-family="-apple-system, sans-serif" font-weight="600" font-size="9">7,842 STEPS •; 94 bpm</text>

  <!-- Side Hardware Buttons -->
  <rect x="281" y="168" width="5" height="18" rx="2" fill="#64748b"/>
  <rect x="281" y="212" width="5" height="18" rx="2" fill="#64748b"/>
</svg>
