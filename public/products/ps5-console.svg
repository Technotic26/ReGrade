<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="glowPs" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psWhiteL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="psBlackC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="psBlueLed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#glowPs)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#000000" opacity="0.6" filter="blur(8px)"/>

  <!-- Left Curved White Plate -->
  <path d="M 130 90 C 135 60, 160 50, 175 60 L 175 310 C 160 320, 135 320, 130 300 Z" fill="url(#psWhiteL)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Right Curved White Plate -->
  <path d="M 270 90 C 265 60, 240 50, 225 60 L 225 310 C 240 320, 265 320, 270 300 Z" fill="url(#psWhiteL)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Center Glossy Black Body -->
  <path d="M 172 62 L 228 62 L 223 318 L 177 318 Z" fill="url(#psBlackC)"/>

  <!-- Blue/Cyan Glowing Lightstrip Inset -->
  <path d="M 174 65 L 178 315" stroke="url(#psBlueLed)" stroke-width="2.5" filter="drop-shadow(0 0 4px #38bdf8)"/>
  <path d="M 226 65 L 222 315" stroke="url(#psBlueLed)" stroke-width="2.5" filter="drop-shadow(0 0 4px #38bdf8)"/>

  <!-- Front I/O Ports & Power Button -->
  <rect x="198" y="190" width="4" height="14" rx="2" fill="#00f5a0"/>
  <rect x="198" y="215" width="4" height="10" rx="2" fill="#475569"/>
  <circle cx="200" cy="285" r="2.5" fill="#38bdf8"/>

  <!-- Stand Base -->
  <ellipse cx="200" cy="322" rx="45" ry="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- AI Verified Pill -->
  <rect x="135" y="130" width="130" height="26" rx="8" fill="#020617" fill-opacity="0.9" stroke="#00f5a0" stroke-width="1"/>
  <circle cx="147" cy="143" r="3.5" fill="#00f5a0"/>
  <text x="156" y="147" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="9">GRADE A •; ZERO DUST</text>
</svg>
