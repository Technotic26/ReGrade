<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="glowTab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tabBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tabScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="40%" stop-color="#0f766e"/>
      <stop offset="80%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="170" fill="url(#glowTab)"/>

  <!-- Tablet Frame -->
  <rect x="90" y="60" width="220" height="280" rx="24" fill="url(#tabBody)" stroke="#64748b" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>

  <!-- Screen Bezel -->
  <rect x="98" y="68" width="204" height="264" rx="16" fill="#020617"/>

  <!-- Display Canvas -->
  <rect x="104" y="74" width="192" height="252" rx="12" fill="url(#tabScreen)"/>

  <!-- Front Camera Dot -->
  <circle cx="200" cy="71" r="2" fill="#000000" stroke="#334155" stroke-width="0.5"/>

  <!-- UI Elements on Tablet -->
  <text x="200" y="140" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="24">iPad Air</text>
  <text x="200" y="158" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">10.9-inch Liquid Retina •; 64GB</text>

  <!-- Inspection Card on Screen -->
  <rect x="120" y="210" width="160" height="48" rx="10" fill="#020617" fill-opacity="0.85" stroke="#00f5a0" stroke-width="1"/>
  <circle cx="134" cy="226" r="4" fill="#00f5a0"/>
  <text x="144" y="230" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="bold" font-size="9">GRADE A •; CHASSIS STRAIGHT</text>
  <text x="128" y="248" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8">Battery Health: 90% •; Zero Dead Pixels</text>
</svg>
